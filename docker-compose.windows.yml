# Windows環境専用のdocker-compose設定
# WSL2バックエンドを使用する場合の追加設定

services:
  arch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arch-windows
    ports:
      - "8501:8501"
    volumes:
      # Windowsパスの形式でマウント（WSL2経由）
      # WSL2を使用する場合、通常のパス形式で動作します
      - ./db_folder:/app/db_folder
      - ./logs:/app/logs
      - ./data:/app/data
      - ./src:/app/src
      - ./pages:/app/pages
      - ./Arch.py:/app/Arch.py
      - ./src/config.py:/app/src/config.py
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      # Windows環境でのパス区切り文字の問題を回避
      - TZ=Asia/Tokyo
    restart: unless-stopped
    networks:
      - qc-network
    # Windows環境でのリソース制限（オプション）
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

networks:
  qc-network:
    driver: bridge

