services:
  arch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arch
    ports:
      - "8501:8501"
    volumes:
      # データベースフォルダをマウント（データの永続化）
      - ./db_folder:/app/db_folder
      # ログフォルダをマウント
      - ./logs:/app/logs
      # マスターデータをマウント
      - ./data:/app/data
      # アプリケーションコードをマウント（開発時のホットリロード用）
      - ./src:/app/src
      - ./pages:/app/pages
      - ./Arch.py:/app/Arch.py
      - ./src/config.py:/app/src/config.py
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    networks:
      - qc-network

networks:
  qc-network:
    driver: bridge

