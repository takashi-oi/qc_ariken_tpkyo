services:
  arch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arch
    ports:
      - "8501:8501"
    volumes:
      - ./db_folder:/app/db_folder
      - ./logs:/app/logs
      - ./data:/app/data
      - ./src:/app/src
      - ./pages:/app/pages
      - ./Arch.py:/app/Arch.py
      - ./src/config.py:/app/src/config.py
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    networks:
      - arch-network

networks:
  arch-network:
    driver: bridge




